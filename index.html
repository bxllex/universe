<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จักรวาลของเรา ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Sarabun:wght@300;400;600&family=Itim&display=swap" rel="stylesheet">
<style>
:root{
  --night-0:#070b1e;--night-1:#0d1330;--night-2:#1a1b42;--nebula:#2a1f4d;
  --star-gold:#f4d58d;--rose:#f0a6c0;--text:#efe9ff;--muted:#9296c0;--glass:rgba(20,24,58,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Sarabun',system-ui,sans-serif;color:var(--text);position:fixed;inset:0;
  background:
    radial-gradient(120% 90% at 50% -10%, var(--nebula) 0%, rgba(42,31,77,0) 55%),
    radial-gradient(140% 120% at 80% 110%, #241a44 0%, rgba(36,26,68,0) 50%),
    linear-gradient(180deg, var(--night-1) 0%, var(--night-0) 60%, #05060f 100%);}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* ---------- ส่วนหัว ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:3;text-align:center;padding:34px 20px 0;
  opacity:0;transform:translateY(-8px);transition:opacity .9s ease .3s,transform .9s ease .3s;
  pointer-events:none}
body.open .top{opacity:1;transform:none}
.top .welcome{font-family:'Itim',cursive;color:var(--rose);font-size:16px}
.top h1{font-family:'Prompt',sans-serif;font-weight:600;font-size:clamp(24px,6.5vw,34px);
  text-shadow:0 0 26px rgba(244,213,141,.28);margin-top:2px}
.top .hint{color:var(--muted);font-size:12.5px;margin-top:6px}

/* ---------- ดวงดาวเมนู ---------- */
.stars{position:fixed;inset:0;z-index:3}
.star-link{position:absolute;transform:translate(-50%,-50%) scale(.5);opacity:0;
  display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;
  transition:opacity .7s ease,transform .7s cubic-bezier(.34,1.4,.5,1);cursor:pointer}
body.open .star-link{opacity:1;transform:translate(-50%,-50%) scale(1)}
.star-link .dot{width:16px;height:16px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 36% 32%,#fff,var(--star-gold) 55%,#e0ab55);
  box-shadow:0 0 16px var(--star-gold);transition:transform .3s,box-shadow .3s;
  animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{box-shadow:0 0 12px var(--star-gold)}50%{box-shadow:0 0 22px var(--star-gold)}}
.star-link.hero .dot{width:30px;height:30px;box-shadow:0 0 30px var(--star-gold)}
.star-link:hover .dot,.star-link:focus-visible .dot{transform:scale(1.25);
  box-shadow:0 0 30px var(--star-gold),0 0 60px rgba(244,213,141,.5)}
.star-link .label{font-family:'Prompt',sans-serif;font-size:13.5px;color:var(--text);
  white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.7);letter-spacing:.01em}
.star-link.hero .label{font-size:16px;color:#fff}
.star-link .sub{font-size:11px;color:var(--muted);margin-top:-5px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.star-link:focus-visible{outline:none}
.star-link:focus-visible .label{color:var(--star-gold)}

/* ---------- หน้าล็อก ---------- */
.lock{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
  padding:26px;background:rgba(5,7,18,.35);backdrop-filter:blur(2px);
  transition:opacity .7s ease;text-align:center}
.lock.hide{opacity:0;pointer-events:none}
.lock .card{max-width:340px;width:100%}
.lock .cstar{width:52px;height:52px;margin:0 auto 18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,var(--star-gold) 55%,#d9a24d);
  box-shadow:0 0 30px var(--star-gold);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 22px var(--star-gold)}50%{box-shadow:0 0 38px var(--star-gold)}}
.lock h1{font-family:'Prompt',sans-serif;font-weight:600;font-size:25px;margin-bottom:6px}
.lock .tag{font-family:'Itim',cursive;color:var(--rose);font-size:16px;margin-bottom:24px}
.lock input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-radius:16px;color:var(--text);padding:14px 18px;font-family:'Sarabun',sans-serif;
  font-size:16px;text-align:center;letter-spacing:.14em;outline:none;transition:border-color .3s}
.lock input:focus{border-color:rgba(240,166,192,.55)}
.lock .err{color:#ff9db0;font-size:13px;height:17px;margin:9px 0 2px;opacity:0;transition:opacity .3s}
.lock .err.show{opacity:1}
.lock .btn{width:100%;margin-top:16px;font-family:'Sarabun',sans-serif;font-size:16px;
  color:var(--night-0);background:linear-gradient(135deg,#f7e0a8,#f0a6c0);border:none;
  border-radius:100px;padding:14px;cursor:pointer;box-shadow:0 8px 30px rgba(240,166,192,.28);
  transition:transform .3s}
.lock .btn:hover{transform:translateY(-2px)}
.lock .btn:focus-visible{outline:3px solid var(--star-gold);outline-offset:3px}
.lock .hintx{color:var(--muted);font-size:12.5px;margin-top:12px;cursor:pointer;
  text-decoration:underline dotted}
.lock .hintx b{color:var(--star-gold)}
.lock.shake .card{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.foot{position:fixed;bottom:16px;left:0;right:0;z-index:3;text-align:center;color:var(--muted);
  font-size:11.5px;opacity:0;transition:opacity .8s ease 1s}
body.open .foot{opacity:.7}
.foot b{color:var(--rose)}

@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;transition-duration:.2s!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="top">
  <div class="welcome">ยินดีต้อนรับนะหนูกิ๊บ</div>
  <h1>จักรวาลของเรา</h1>
  <div class="hint">แตะดวงดาวเพื่อไปแต่ละที่ ✦</div>
</div>

<div class="stars" id="stars"></div>

<div class="foot">ทำด้วย <b>&#9829;</b> โดยพี่เบล เพื่อหนูกิ๊บ</div>

<!-- หน้าล็อก -->
<div class="lock" id="lock">
  <div class="card">
    <div class="cstar"></div>
    <h1>จักรวาลของเรา</h1>
    <div class="tag">ที่นี่มีไว้สำหรับหนูเท่านั้น ✦</div>
    <input id="pw" type="password" inputmode="text" placeholder="ใส่รหัสเข้าจักรวาล" autocomplete="off">
    <div class="err" id="err">รหัสยังไม่ถูกนะ ลองอีกทีน้า</div>
    <button class="btn" id="enterBtn">เข้าสู่จักรวาล ✦</button>
    <div class="hintx" id="hintBtn">ลืมรหัส? แตะดูคำใบ้</div>
  </div>
</div>

<script>
/* ============================================================================
   แก้ตรงนี้ได้เลย — รหัส, คำใบ้, ตำแหน่งดาว, ลิงก์
   x,y = ตำแหน่งบนจอเป็นเปอร์เซ็นต์ (0–100)
   ============================================================================ */
const HUB = {
  password: "0815",
  hint: "เดือนกับวันที่เราเจอกันครั้งแรก (ตัวเลข 4 หลัก)",
  stars: [
    { id:"hero", hero:true, icon:"✦", title:"จักรวาลของเรา", sub:"เรื่องราวของเรา",
      url:"universe.html", x:50, y:47 },
    { icon:"💌", title:"ถึงหนู… ผ่านเพลง", sub:"imhere",
      url:"https://bxllex.github.io/imhere/", x:24, y:28 },
    { icon:"🎁", title:"กล่องสุ่มคำหวาน", sub:"lovebox",
      url:"https://bxllex.github.io/love-box-/", x:77, y:31 },
    { icon:"🖤", title:"ถึงหนู 🖤", sub:"make-up",
      url:"https://bxllex.github.io/make-up-with-you/", x:56, y:73 },
    { icon:"🫧", title:"มุมพักใจ", sub:"ไว้ให้หายเหนื่อย",
      url:"rest.html", x:26, y:60 }
  ],
  // เส้นกลุ่มดาว: เชื่อมดาวเด่น (ดัชนี 0) ไปหาแต่ละความทรงจำ
  links: [[0,1],[0,2],[0,3],[0,4]]
};

/* ---------- ท้องฟ้า + เส้นกลุ่มดาว (canvas) ---------- */
const cv=document.getElementById('sky'),ctx=cv.getContext('2d');
let W,H,DPR,bg=[],t=0,opened=false,lineT=0,shoot=[],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  bg=[];const n=Math.round(innerWidth*innerHeight/2600);
  for(let i=0;i<n;i++)bg.push({x:Math.random()*W,y:Math.random()*H,
    r:(Math.random()*1.1+.25)*DPR,tw:Math.random()*6.28,sp:Math.random()*.02+.005,d:Math.random()*.5+.5});}
addEventListener('resize',resize);resize();
function pt(s){return [W*s.x/100, H*s.y/100];}
(function loop(){t+=reduce?0:1;ctx.clearRect(0,0,W,H);
  for(const s of bg){const tw=reduce?.7:(Math.sin(t*s.sp+s.tw)*.4+.6);
    ctx.fillStyle="rgba(230,235,255,"+(tw*s.d)+")";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  // ดาวตกนาน ๆ ที
  if(opened && !reduce && Math.random()<.0018 && shoot.length<1)
    shoot.push({x:Math.random()*W,y:Math.random()*H*.4,len:0,v:4*DPR,a:1});
  shoot.forEach(sh=>{sh.x+=sh.v;sh.y+=sh.v*.5;sh.len=Math.min(sh.len+sh.v,110*DPR);sh.a-=.012;
    const g=ctx.createLinearGradient(sh.x,sh.y,sh.x-sh.len,sh.y-sh.len*.5);
    g.addColorStop(0,"rgba(255,255,255,"+Math.max(0,sh.a)+")");g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.strokeStyle=g;ctx.lineWidth=2*DPR;ctx.beginPath();ctx.moveTo(sh.x,sh.y);
    ctx.lineTo(sh.x-sh.len,sh.y-sh.len*.5);ctx.stroke();});
  shoot=shoot.filter(s=>s.a>0);
  // เส้นกลุ่มดาว (ค่อย ๆ ลากหลังเปิด)
  if(opened){
    lineT=Math.min(1,lineT+ (reduce?1:.012));
    ctx.strokeStyle="rgba(240,166,192,"+(.42)+")";ctx.lineWidth=1.1*DPR;
    ctx.shadowColor="rgba(240,166,192,.5)";ctx.shadowBlur=6*DPR;
    const total=HUB.links.length,shown=lineT*total;
    HUB.links.forEach((l,idx)=>{const a=pt(HUB.stars[l[0]]),b=pt(HUB.stars[l[1]]);
      const f=Math.max(0,Math.min(1,shown-idx));if(f<=0)return;
      ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f);ctx.stroke();});
    ctx.shadowBlur=0;
  }
  requestAnimationFrame(loop);})();

/* ---------- สร้างดวงดาวเมนู ---------- */
const starsEl=document.getElementById('stars');
HUB.stars.forEach((s,i)=>{
  const notSet=s.url.indexOf('https://ใส่')===0;
  const a=document.createElement('a');a.className='star-link'+(s.hero?' hero':'');
  a.href=notSet?'#':s.url;a.style.left=s.x+'%';a.style.top=s.y+'%';
  if(!notSet && s.url.indexOf('http')===0)a.target='_blank';
  a.setAttribute('aria-label',s.title);
  a.style.transitionDelay=(.4+i*.15)+'s';
  a.innerHTML='<span class="dot"></span><span class="label">'+s.title+'</span>'+
    (s.sub?'<span class="sub">'+s.sub+'</span>':'');
  starsEl.appendChild(a);
});

/* ---------- ล็อก ---------- */
const lock=document.getElementById('lock'),pw=document.getElementById('pw'),err=document.getElementById('err');
function unlocked(){try{return sessionStorage.getItem('u')==='1';}catch(e){return false;}}
function markUnlocked(){try{sessionStorage.setItem('u','1');}catch(e){}}
function openMap(){opened=true;document.body.classList.add('open');lock.classList.add('hide');}
function tryEnter(){
  if(pw.value.trim()===String(HUB.password)){markUnlocked();openMap();}
  else{err.classList.add('show');lock.classList.add('shake');pw.value='';pw.focus();
    setTimeout(function(){err.classList.remove('show');lock.classList.remove('shake');},2400);}
}
document.getElementById('enterBtn').onclick=tryEnter;
pw.addEventListener('keydown',function(e){if(e.key==='Enter')tryEnter();});
document.getElementById('hintBtn').onclick=function(){
  this.innerHTML = HUB.hint ? ("คำใบ้: <b>"+HUB.hint+"</b>") : "พี่เบลไม่ได้ใส่คำใบ้ไว้ ✦";
};
if(unlocked())openMap();
</script>
</body>
</html>
