<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>เสี่ยงทายกับดาว ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Sarabun:wght@300;400;600&family=Itim&display=swap" rel="stylesheet">
<style>
:root{
  --night-0:#070b1e;--night-1:#0d1330;--nebula:#2a1f4d;
  --gold:#f4d58d;--rose:#f0a6c0;--purple:#b39ddb;--text:#efe9ff;--muted:#9296c0;--glass:rgba(20,24,58,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Sarabun',system-ui,sans-serif;color:var(--text);position:fixed;inset:0;
  background:
    radial-gradient(120% 90% at 50% -10%, var(--nebula) 0%, rgba(42,31,77,0) 55%),
    radial-gradient(150% 120% at 80% 115%, #2a1a4d 0%, rgba(36,26,68,0) 55%),
    linear-gradient(180deg, var(--night-1) 0%, var(--night-0) 60%, #05060f 100%);}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.home-link{position:fixed;top:14px;left:14px;z-index:20;padding:8px 14px;border-radius:100px;
  background:var(--glass);border:1px solid rgba(240,166,192,.25);color:var(--text);
  backdrop-filter:blur(8px);font-family:'Sarabun',sans-serif;font-size:13px;text-decoration:none}
.home-link:hover{background:rgba(240,166,192,.18)}
.home-link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.screen{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:64px 22px 40px;text-align:center;overflow-y:auto}
.screen.on{display:flex;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen.center{justify-content:center}
.back{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;color:var(--muted);
  background:none;border:none;font-family:'Sarabun';font-size:13.5px;cursor:pointer}
.back:hover{color:var(--text)}
h2.title{font-family:'Prompt',sans-serif;font-weight:600;font-size:clamp(21px,5.4vw,28px);
  text-shadow:0 0 24px rgba(179,157,219,.35)}
.lead{color:var(--muted);font-size:14px;margin-top:6px;max-width:23em;line-height:1.6}

#menu{justify-content:center}
#menu .welcome{font-family:'Itim',cursive;color:var(--purple);font-size:17px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px;width:100%;max-width:440px}
.corner{background:linear-gradient(160deg,rgba(38,28,66,.72),rgba(16,18,46,.72));
  border:1px solid rgba(179,157,219,.28);border-radius:18px;padding:18px 12px;cursor:pointer;
  color:var(--text);display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .25s,border-color .25s,box-shadow .25s}
.corner:hover{transform:translateY(-3px);border-color:rgba(179,157,219,.6);
  box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 20px rgba(179,157,219,.15)}
.corner:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.corner .em{font-size:30px}
.corner .cn{font-family:'Prompt',sans-serif;font-size:14px;font-weight:500}
.corner .cd{font-size:11px;color:var(--muted);line-height:1.4}

.btn{font-family:'Sarabun',sans-serif;font-size:16px;color:var(--night-0);
  background:linear-gradient(135deg,#e6c8f5,#f0a6c0);border:none;border-radius:100px;
  padding:13px 28px;cursor:pointer;margin-top:20px;box-shadow:0 8px 30px rgba(179,157,219,.3);transition:transform .3s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.tabs{display:inline-flex;gap:6px;margin-top:16px;background:rgba(255,255,255,.05);
  border:1px solid rgba(179,157,219,.25);border-radius:100px;padding:4px;flex-wrap:wrap;justify-content:center}
.tab{font-family:'Sarabun',sans-serif;font-size:13px;color:var(--muted);background:none;border:none;
  border-radius:100px;padding:8px 16px;cursor:pointer;transition:all .25s}
.tab.on{background:linear-gradient(135deg,#e6c8f5,#f0a6c0);color:var(--night-0);font-weight:600}
.tab:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.mu-input{width:100%;max-width:320px;margin-top:16px;background:rgba(255,255,255,.06);
  border:1px solid rgba(179,157,219,.3);border-radius:100px;color:var(--text);padding:13px 18px;
  font-family:'Sarabun',sans-serif;font-size:15px;text-align:center;outline:none}
.mu-input:focus{border-color:rgba(179,157,219,.6)}

/* การ์ดไพ่/เซียมซี */
.deck{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.tpos{font-family:'Prompt',sans-serif;font-size:12px;color:var(--purple);margin-bottom:6px}
.tcard{width:150px;height:228px;perspective:1000px;cursor:pointer}
.tcard.sm{width:100px;height:156px}
.ti{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.2,.2,1)}
.tcard.flipped .ti{transform:rotateY(180deg)}
.tface{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;
  border:1px solid rgba(244,213,141,.4);box-shadow:0 10px 28px rgba(0,0,0,.45)}
.tback{background:repeating-linear-gradient(45deg,rgba(244,213,141,.06) 0 6px,transparent 6px 12px),
   radial-gradient(circle at 50% 35%,#3a2f66,#171a3d)}
.tback span{font-size:38px;filter:drop-shadow(0 0 12px var(--gold))}
.tfront{transform:rotateY(180deg);background:linear-gradient(180deg,#2a2350,#14142f);border-color:rgba(179,157,219,.5)}
.tico{font-size:40px;transition:transform .4s}.tcard.sm .tico{font-size:30px}
.tname{font-family:'Prompt',sans-serif;font-weight:600;font-size:14px;color:var(--gold);margin-top:6px;line-height:1.2}
.tcard.sm .tname{font-size:11px}
.torient{font-size:11px;color:var(--muted);margin-top:3px}

/* กล่องผลลัพธ์ */
.reading{width:100%;max-width:400px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.rblock{background:rgba(255,255,255,.05);border:1px solid rgba(179,157,219,.22);border-radius:16px;
  padding:13px 16px;text-align:left}
.rblock .rh{font-family:'Prompt',sans-serif;font-size:14px;color:var(--gold);margin-bottom:7px}
.rblock .rh small{color:var(--muted);font-weight:400;font-size:12px}
.rrow{font-size:13.5px;line-height:1.6;color:#f2ecfb;margin:3px 0}
.rrow b{color:var(--purple);font-weight:500}
.rnote{font-family:'Itim',cursive;font-size:15px;color:var(--rose);text-align:center;padding:4px 6px;line-height:1.6}
.badge{display:inline-block;font-family:'Prompt';font-size:12px;padding:3px 12px;border-radius:100px;
  background:rgba(244,213,141,.15);color:var(--gold);border:1px solid rgba(244,213,141,.3);margin-top:2px}
.swatch{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:middle;
  margin-right:8px;border:2px solid rgba(255,255,255,.4)}
.luckynum{font-family:'Prompt',sans-serif;font-weight:600;font-size:22px;color:var(--gold)}
.frow.inline{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ราศี */
.zodiac{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}
.zi{display:flex;flex-direction:column;align-items:center;gap:4px}
.zi .zsym{font-size:40px}.zi .zname{font-family:'Prompt',sans-serif;font-size:13px}
.zi .zwho{font-size:11px;color:var(--muted)}
.zheart{font-size:26px;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.zpct{font-family:'Prompt',sans-serif;font-weight:600;font-size:32px;color:var(--gold);margin-top:14px;
  text-shadow:0 0 22px rgba(244,213,141,.35)}
.zsysnote{color:var(--muted);font-size:11.5px;margin-top:12px;max-width:24em;line-height:1.5;opacity:.85}
.wishstar{position:fixed;left:26%;bottom:24%;width:9px;height:9px;border-radius:50%;z-index:12;
  background:#fff;box-shadow:0 0 12px #fff,0 0 26px var(--gold);pointer-events:none;animation:wishfly 1.7s ease-in forwards}
@keyframes wishfly{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(50vw,-72vh) scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;transition-duration:.3s!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<!-- เมนู -->
<section class="screen on" id="menu">

  <div class="lead">เลือกวิธีดูดวงที่อยากลองได้เลยนะ 🔮</div>

<!-- ไพ่ทาโรต์ -->
<section class="screen" id="cards">

  <div class="tabs"><button class="tab on" id="mode1">ไพ่วันนี้ (1 ใบ)</button>

  <button class="btn" id="drawBtn">จั่วไพ่ ✦</button>

<!-- เซียมซี -->

</section>

</section>

<!-- เลขศาสตร์ -->
<section class="screen" id="numero">
  <button class="back" data-back>← เสี่ยงทายกับดาว</button>
  <h2 class="title">เลขศาสตร์จากวันเกิด</h2>
  <div class="lead">ใส่วันเกิดของหนู แล้วดูเลขชีวิตกับคำทำนายรอบด้าน ✦</div>
  <input class="mu-input" id="birth" type="date">
  <button class="btn" id="numBtn">คำนวณเลขชีวิต 🔢</button>
  <div class="reading" id="numReading"></div>
</section>

<!-- ราศี -->
<section class="screen center" id="zodiac">
  <button class="back" data-back>← เสี่ยงทายกับดาว</button>
  <h2 class="title">ดวงความเข้ากันของเรา</h2>
  <div class="tabs"><button class="tab on" id="tabIntl">สากล</button>
    <button class="tab" id="tabThai">ไทย</button></div>
  <div class="zodiac">
    <div class="zi"><div class="zsym" id="belSym"></div><div class="zname" id="belName"></div><div class="zwho">พี่เบล</div></div>
    <div class="zheart">💖</div>
    <div class="zi"><div class="zsym" id="gibSym"></div><div class="zname" id="gibName"></div><div class="zwho">หนูกิ๊บ</div></div>
  </div>
  <div class="zpct" id="zpct"></div>
  <div class="reading" style="margin-top:8px"><div class="rnote" id="zmsg"></div></div>
  <div class="zsysnote" id="zsysnote"></div>
</section>

   note:"* ระบบสากล — มังกร 22 ธ.ค.–19 ม.ค. / กรกฎ 22 มิ.ย.–22 ก.ค."},
 thai:{bel:{sym:"♋",name:"ราศีกรกฎ"},gib:{sym:"♐",name:"ราศีธนู"},percent:"93%",
   msg:"กรกฎ (พี่เบล) ที่อบอุ่น รักและดูแลคนของตัวเอง เจอกับ ธนู (หนูกิ๊บ) ที่สดใส ร่าเริง มองโลกในแง่ดี — เติมเต็มกันได้ดีมาก ยิ่งอยู่ยิ่งสนุกและอบอุ่น ✦",
   note:"* ระบบไทย (สายนะ) — ธนู ~15 ธ.ค.–13 ม.ค. / กรกฎ ~15 ก.ค.–16 ส.ค."}
};

/* ---------- พื้นหลัง ---------- */
const cv=document.getElementById('sky'),ctx=cv.getContext('2d');
let W,H,DPR,stars=[],t=0,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  stars=[];const n=Math.round(innerWidth*innerHeight/3000);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.1+.25)*DPR,
    tw:Math.random()*6.28,sp:Math.random()*.02+.005,d:Math.random()*.5+.5});}
addEventListener('resize',resize);resize();
(function loop(){t+=reduce?0:1;ctx.clearRect(0,0,W,H);
  for(const s of stars){const tw=reduce?.7:(Math.sin(t*s.sp+s.tw)*.4+.6);
    ctx.fillStyle="rgba(230,235,255,"+(tw*s.d)+")";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  requestAnimationFrame(loop);})();

/* ---------- เมนู/หน้าจอ ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if(id==='daily')renderDaily();
  if(id==='zodiac')renderZodiac();}
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('menu'));
const grid=document.getElementById('cornerGrid');
CORNERS.forEach(c=>{const b=document.createElement('button');b.className='corner';
  b.innerHTML='<span class="em">'+c.em+'</span><span class="cn">'+c.name+'</span><span class="cd">'+c.desc+'</span>';
  b.onclick=()=>show(c.id);grid.appendChild(b);});
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function daySeed(){const d=new Date();return d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate();}

/* ---------- ไพ่ทาโรต์ ---------- */
let tmode=1,tState='ready';
const deck=document.getElementById('deck'),reading=document.getElementById('reading'),
      drawBtn=document.getElementById('drawBtn'),cardsLead=document.getElementById('cardsLead');
function setMode(m){tmode=m;tState='ready';
  document.getElementById('mode1').classList.toggle('on',m===1);
  document.getElementById('mode3').classList.toggle('on',m===3);
  cardsLead.textContent=m===1?'ตั้งจิตถึงสิ่งที่อยากรู้ แล้วจั่วไพ่นะ ✦':'จั่ว 3 ใบ อดีต–ปัจจุบัน–อนาคต ✦';
  reading.innerHTML='';drawBtn.textContent='จั่วไพ่ ✦';buildDeck();}
function buildDeck(){deck.innerHTML='';
  for(let i=0;i<tmode;i++){const wrap=document.createElement('div');
    wrap.style.cssText='display:flex;flex-direction:column;align-items:center';
    if(tmode===3){const pl=document.createElement('div');pl.className='tpos';pl.textContent=posLabels[i];wrap.appendChild(pl);}
    const c=document.createElement('div');c.className='tcard'+(tmode===3?' sm':'');
    c.innerHTML='<div class="ti"><div class="tface tback"><span>✦</span></div>'+
      '<div class="tface tfront"><div class="tico"></div><div class="tname"></div><div class="torient"></div></div></div>';
    wrap.appendChild(c);deck.appendChild(wrap);}}
function drawOne(){return {card:TAROT[Math.floor(Math.random()*TAROT.length)],rev:Math.random()<0.5};}
function fillCard(el,c,rev){el.querySelector('.tico').textContent=c.ico;
  el.querySelector('.tico').style.transform=rev?'rotate(180deg)':'none';
  el.querySelector('.tname').textContent=c.n;el.querySelector('.torient').textContent=rev?'(หัวกลับ)':'(ตั้งตรง)';}
function aspects(r){return r.rev?r.card.rev:r.card.up;}
function draw(){if(tState==='done'){setMode(tmode);return;}
  const cards=[...deck.querySelectorAll('.tcard')];const results=cards.map(()=>drawOne());
  cards.forEach((el,i)=>{fillCard(el,results[i].card,results[i].rev);setTimeout(()=>el.classList.add('flipped'),i*280);});
  setTimeout(()=>renderTarot(results),cards.length*280+450);
  tState='done';drawBtn.textContent='จั่วใหม่ ✦';}
function renderTarot(results){reading.innerHTML='';
  if(tmode===1){const r=results[0],m=aspects(r),o=r.rev?'หัวกลับ':'ตั้งตรง';
    const b=document.createElement('div');b.className='rblock';
    b.innerHTML='<div class="rh">'+r.card.ico+' '+r.card.n+' <small>· '+o+'</small></div>'+
      '<div class="rrow"><b>ภาพรวม:</b> '+m.key+'</div>'+
      '<div class="rrow"><b>❤️ ความรัก:</b> '+m.love+'</div>'+
      '<div class="rrow"><b>💼 การงาน:</b> '+m.work+'</div>'+
      '<div class="rrow"><b>💰 การเงิน:</b> '+m.money+'</div>'+
      '<div class="rrow"><b>🌱 สุขภาพใจ:</b> '+m.heart+'</div>'+
      '<div class="rrow"><b>✦ คำแนะนำ:</b> '+m.adv+'</div>';
    reading.appendChild(b);
  }else{results.forEach((r,i)=>{const m=aspects(r),o=r.rev?'หัวกลับ':'ตั้งตรง';
    const b=document.createElement('div');b.className='rblock';
    b.innerHTML='<div class="rh">'+posLabels[i]+' — '+r.card.ico+' '+r.card.n+' <small>· '+o+'</small></div>'+
      '<div class="rrow"><b>ภาพรวม:</b> '+m.key+'</div>'+
      '<div class="rrow"><b>💼 การงาน:</b> '+m.work+'</div>'+
      '<div class="rrow"><b>❤️ ความรัก:</b> '+m.love+'</div>'+
      '<div class="rrow"><b>✦ คำแนะนำ:</b> '+m.adv+'</div>';
    reading.appendChild(b);});}
  const note=document.createElement('div');note.className='rnote';note.textContent=pick(sweetNotes);reading.appendChild(note);}
document.getElementById('mode1').onclick=()=>setMode(1);
document.getElementById('mode3').onclick=()=>setMode(3);
drawBtn.onclick=draw;setMode(1);

/* ---------- ดูดวงวันนี้ ---------- */
function renderDaily(){const s=daySeed(),d=new Date();
  document.getElementById('fdate').textContent='ประจำวันที่ '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
  const col=DAILY.colors[(s+5)%DAILY.colors.length];
  document.getElementById('dailyReading').innerHTML=
    '<div class="rblock">'+
    '<div class="rrow"><b>🔮 ภาพรวม:</b> '+DAILY.overall[s%DAILY.overall.length]+'</div>'+
    '<div class="rrow"><b>💼 การงาน:</b> '+DAILY.work[(s+1)%DAILY.work.length]+'</div>'+
    '<div class="rrow"><b>💰 การเงิน:</b> '+DAILY.money[(s+2)%DAILY.money.length]+'</div>'+
    '<div class="rrow"><b>❤️ ความรัก:</b> '+DAILY.love[(s+3)%DAILY.love.length]+'</div>'+
    '<div class="rrow"><b>🌱 สุขภาพ:</b> '+DAILY.health[(s+4)%DAILY.health.length]+'</div>'+
    '</div>'+
    '<div class="rblock"><div class="frow inline"><span><b style="color:var(--purple)">🌈 สีมงคล</b></span>'+
      '<span><span class="swatch" style="background:'+col.c+'"></span>'+col.n+'</span></div>'+
    '<div class="frow inline" style="margin-top:8px"><span><b style="color:var(--purple)">🔢 เลขนำโชค</b></span>'+
      '<span class="luckynum">'+((s+7)%10)+'</span></div></div>';}

/* ---------- เลขศาสตร์ ---------- */
function lifePath(str){let s=str.replace(/[^0-9]/g,'').split('').reduce((a,b)=>a+(+b),0);
  while(s>9)s=(''+s).split('').reduce((a,b)=>a+(+b),0);return s||1;}
document.getElementById('numBtn').onclick=function(){
  const v=document.getElementById('birth').value;const box=document.getElementById('numReading');
  if(!v){box.innerHTML='<div class="rnote">ใส่วันเกิดก่อนนะ ✦</div>';return;}
  const n=lifePath(v),info=NUMERO[n];
  box.innerHTML='<div class="rblock"><div class="rh">🔢 เลขชีวิตของหนูคือ <b style="color:var(--gold)">'+n+'</b></div>'+
    '<div class="rrow"><b>บุคลิก:</b> '+info.t+'</div>'+
    '<div class="rrow"><b>💼 การงาน:</b> '+info.work+'</div>'+
    '<div class="rrow"><b>💰 การเงิน:</b> '+info.money+'</div>'+
    '<div class="rrow"><b>❤️ ความรัก:</b> '+info.love+'</div>'+
    '<div class="rrow"><b>✦ คำแนะนำ:</b> '+info.adv+'</div></div>'+
    '<div class="rnote">'+pick(sweetNotes)+'</div>';};

/* ---------- ราศี ---------- */
let zsys='intl';
function renderZodiac(){const z=ZODIAC[zsys];
  document.getElementById('belSym').textContent=z.bel.sym;document.getElementById('belName').textContent=z.bel.name;
  document.getElementById('gibSym').textContent=z.gib.sym;document.getElementById('gibName').textContent=z.gib.name;
  document.getElementById('zpct').textContent=z.percent+' เข้ากัน';
  document.getElementById('zmsg').textContent=z.msg;document.getElementById('zsysnote').textContent=z.note;
  document.getElementById('tabIntl').classList.toggle('on',zsys==='intl');
  document.getElementById('tabThai').classList.toggle('on',zsys==='thai');}
document.getElementById('tabIntl').onclick=()=>{zsys='intl';renderZodiac();};
document.getElementById('tabThai').onclick=()=>{zsys='thai';renderZodiac();};
</script>
