<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ดาวเคราะห์ของเรา ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Sarabun:wght@300;400;600&family=Itim&display=swap" rel="stylesheet">
<style>
:root{
  --night-0:#070b1e;--night-1:#0d1330;--night-2:#1a1b42;--nebula:#2a1f4d;
  --star-gold:#f4d58d;--rose:#f0a6c0;--text:#efe9ff;--muted:#9296c0;--glass:rgba(20,24,58,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Sarabun',system-ui,sans-serif;color:var(--text);position:fixed;inset:0;
  background:
    radial-gradient(120% 90% at 50% -10%, var(--nebula) 0%, rgba(42,31,77,0) 55%),
    radial-gradient(150% 120% at 80% 115%, #2a1a4d 0%, rgba(36,26,68,0) 55%),
    linear-gradient(180deg, #0c1030 0%, var(--night-0) 55%, #04050d 100%);}
canvas#space{position:fixed;inset:0;width:100%;height:100%;z-index:0;touch-action:none;cursor:grab}
canvas#space:active{cursor:grabbing}

.home-link,.sound{position:fixed;top:14px;z-index:20;padding:8px 14px;border-radius:100px;
  background:var(--glass);border:1px solid rgba(240,166,192,.25);color:var(--text);
  backdrop-filter:blur(8px);font-family:'Sarabun',sans-serif;font-size:13px;text-decoration:none;
  cursor:pointer;transition:transform .3s,background .3s}
.home-link{left:14px}.sound{right:14px;width:40px;height:40px;display:flex;align-items:center;
  justify-content:center;font-size:17px;padding:0}
.home-link:hover,.sound:hover{transform:translateY(-1px);background:rgba(240,166,192,.18)}

.top{position:fixed;top:0;left:0;right:0;z-index:10;text-align:center;padding:56px 20px 0;
  pointer-events:none}
.top h1{font-family:'Prompt',sans-serif;font-weight:600;font-size:clamp(22px,6vw,30px);
  text-shadow:0 0 26px rgba(244,213,141,.3)}
.top .hint{color:var(--muted);font-size:12.5px;margin-top:4px}

/* แถบล่าง: ปลูกดาว + ตัวนับ */
.dock{position:fixed;left:0;right:0;bottom:22px;z-index:10;display:flex;flex-direction:column;
  align-items:center;gap:10px;pointer-events:none}
.count{color:var(--muted);font-size:12.5px}
.count b{color:var(--star-gold);font-weight:600}
.plant{pointer-events:auto;font-family:'Sarabun',sans-serif;font-size:16px;color:var(--night-0);
  background:linear-gradient(135deg,#f7e0a8,#f0a6c0);border:none;border-radius:100px;
  padding:13px 28px;cursor:pointer;box-shadow:0 8px 30px rgba(240,166,192,.32);transition:transform .3s}
.plant:hover{transform:translateY(-2px)}.plant:active{transform:scale(.97)}
.plant:disabled{opacity:.5;cursor:default}
.plant:focus-visible{outline:3px solid var(--star-gold);outline-offset:3px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);z-index:11;
  background:var(--glass);border:1px solid rgba(240,166,192,.25);backdrop-filter:blur(8px);
  color:var(--text);font-family:'Itim',cursive;font-size:14.5px;padding:10px 18px;border-radius:100px;
  max-width:86%;text-align:center;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* การ์ดข้อความจากจุดเรืองแสง */
.card-wrap{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:26px}
.card-wrap.show{display:flex}
.card-bg{position:absolute;inset:0;background:rgba(5,7,18,.6);backdrop-filter:blur(4px)}
.card{position:relative;max-width:340px;width:100%;text-align:center;
  background:linear-gradient(180deg,rgba(26,27,66,.95),rgba(13,19,48,.97));
  border:1px solid rgba(240,166,192,.28);border-radius:24px;padding:28px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.card .ico{font-size:40px;margin-bottom:8px}
.card h3{font-family:'Prompt',sans-serif;font-weight:600;font-size:18px;margin-bottom:10px}
.card p{font-family:'Itim',cursive;font-size:17px;line-height:1.75;color:#f6ecf6}
.card .x{margin-top:20px;font-family:'Sarabun';font-size:14px;color:var(--night-0);
  background:linear-gradient(135deg,#f7e0a8,#f0a6c0);border:none;border-radius:100px;
  padding:10px 26px;cursor:pointer}
.card .x:focus-visible{outline:3px solid var(--star-gold);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important}}
</style>
</head>
<body>
<canvas id="space"></canvas>
<a class="home-link" href="index.html">← หน้าหลัก</a>
<button class="sound" id="soundBtn" aria-label="เปิด/ปิดเสียง">🔇</button>

<div class="top">
  <h1>ดาวเคราะห์ของเรา</h1>
  <div class="hint">ลากเพื่อหมุน • แตะจุดเรืองแสงเพื่อสำรวจ ✦</div>
</div>

<div class="dock">
  <div class="count">ดาวบนดาวเคราะห์ของเรา: <b id="starCount">0</b> ดวง</div>
  <button class="plant" id="plantBtn">ปลูกดาววันนี้ ✦</button>
</div>
<div class="toast" id="toast"></div>

<div class="card-wrap" id="card">
  <div class="card-bg" id="cardBg"></div>
  <div class="card">
    <div class="ico" id="cardIco">✦</div>
    <h3 id="cardTitle"></h3>
    <p id="cardMsg"></p>
    <button class="x" id="cardClose">ปิด ✦</button>
  </div>
</div>

<script>
/* ============================================================================
   แก้ตรงนี้ได้เลย — จุดเรืองแสงบนดาวเคราะห์ + ข้อความ
   lat = -90..90 (ละติจูด) , lon = 0..360 (ลองจิจูด)
   ============================================================================ */
const PLANET = {
  landmarks: [
    { icon:"🏠", lat:12,  lon:20,  title:"บ้านของเรา",
      msg:"สักวันพี่อยากมีบ้านอุ่น ๆ ให้เราได้อยู่ด้วยกันนะ ✦" },
    { icon:"🌳", lat:-14, lon:115, title:"ต้นไม้แห่งความทรงจำ",
      msg:"ต้นนี้ปลูกจากวันที่เราเจอกันครั้งแรก แล้วมันก็โตขึ้นทุกวัน เหมือนความรู้สึกของพี่ 🌱" },
    { icon:"🗼", lat:34,  lon:205, title:"ประภาคารของพี่",
      msg:"ไม่ว่าหนูจะอยู่ไกลแค่ไหน พี่ขอเป็นแสงไฟที่คอยส่องทางให้เสมอนะ ✦" },
    { icon:"💌", lat:-28, lon:295, title:"กล่องจดหมาย",
      msg:"พี่แอบซ่อนคำว่า ‘คิดถึงหนู’ ไว้ในนี้ทุกวันเลยนะ 💌" },
    { icon:"⛰️", lat:46,  lon:150, title:"ภูเขาแห่งความฝัน",
      msg:"อยากพาหนูไปดูวิวสวย ๆ บนยอดเขาด้วยกันสักวัน สัญญานะ ⛰️✦" }
  ],
  moon: { title:"พระจันทร์ดวงเดียวกัน",
    msg:"พระจันทร์ดวงนี้ เป็นดวงเดียวกับที่หนูมองอยู่ตอนนี้เลยนะ ✦ เราอยู่ใต้ฟ้าเดียวกันเสมอ 🌙" },
  plantMessages: [
    "ปลูกดาวดวงใหม่ให้ดาวเคราะห์ของเราแล้ว ✦ พรุ่งนี้แวะมาปลูกอีกนะ",
    "ดาวเคราะห์เราสว่างขึ้นอีกนิดแล้ว 🌟 ขอบคุณที่แวะมาหากันนะ",
    "อีกหนึ่งดวงแล้วนะ ✦ ค่อย ๆ เต็มฟ้าไปด้วยกัน"
  ],
  plantedTodayMsg: "วันนี้ปลูกไปแล้วนะ ✦ พรุ่งนี้แวะมาปลูกใหม่น้า 🌙"
};

/* ---------------- canvas ---------------- */
const cv=document.getElementById('space'),ctx=cv.getContext('2d');
let W,H,DPR,cx,cy,R,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let bg=[];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  cx=W/2;cy=H*0.52;R=Math.min(W,H)*0.30;
  bg=[];const n=Math.round(innerWidth*innerHeight/2400);
  for(let i=0;i<n;i++)bg.push({x:Math.random()*W,y:Math.random()*H,
    r:(Math.random()*1.1+.25)*DPR,tw:Math.random()*6.28,sp:Math.random()*.02+.005,d:Math.random()*.5+.5});}
addEventListener('resize',resize);resize();

/* ---------------- state ---------------- */
let rot=0, autoSpin=0.06, dragging=false, lastX=0, lastY=0, vel=0, moved=0, moonA=0, t=0;
// ดาวที่ปลูก (เก็บใน localStorage ถ้าได้)
let planted=[];
function load(){try{const s=localStorage.getItem('planet_stars');if(s)planted=JSON.parse(s);}catch(e){}}
function save(){try{localStorage.setItem('planet_stars',JSON.stringify(planted));}catch(e){}}
load();
document.getElementById('starCount').textContent=planted.length;

/* ---------------- projection ---------------- */
function project(latDeg,lonDeg){
  const p=latDeg*Math.PI/180, th=(lonDeg+rot)*Math.PI/180;
  const x=Math.cos(p)*Math.sin(th), y=-Math.sin(p), z=Math.cos(p)*Math.cos(th);
  return {sx:cx+R*x, sy:cy+R*y, z};
}

/* ---------------- draw ---------------- */
function drawPlanet(){
  // ชั้นบรรยากาศเรืองแสง
  const halo=ctx.createRadialGradient(cx,cy,R*0.9,cx,cy,R*1.6);
  halo.addColorStop(0,'rgba(240,166,192,.28)');halo.addColorStop(.5,'rgba(140,120,200,.12)');
  halo.addColorStop(1,'rgba(140,120,200,0)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,R*1.6,0,7);ctx.fill();
  // วงแหวนโคจรจาง ๆ
  ctx.save();ctx.translate(cx,cy);ctx.scale(1,0.34);
  ctx.strokeStyle='rgba(240,213,141,.14)';ctx.lineWidth=1.4*DPR;
  ctx.beginPath();ctx.arc(0,0,R*1.75,0,7);ctx.stroke();ctx.restore();
  // ตัวดาวเคราะห์ (ไล่เฉดให้เป็นทรงกลม)
  const g=ctx.createRadialGradient(cx-R*0.38,cy-R*0.4,R*0.1, cx,cy,R);
  g.addColorStop(0,'#7b86c4');g.addColorStop(.45,'#414781');g.addColorStop(.8,'#20234f');g.addColorStop(1,'#12142f');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  // ทวีปจาง ๆ (จุดผิวหมุนตาม)
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
  CONTINENTS.forEach(c=>{const p=project(c.lat,c.lon);if(p.z<=0)return;
    ctx.fillStyle='rgba(120,150,180,'+(.10*p.z)+')';
    ctx.beginPath();ctx.ellipse(p.sx,p.sy,c.r*R*(0.5+0.5*p.z),c.r*R*0.7*(0.5+0.5*p.z),0,0,7);ctx.fill();});
  ctx.restore();
  // ขอบสว่าง (rim light)
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
  const rim=ctx.createRadialGradient(cx-R*0.5,cy-R*0.5,R*0.6,cx-R*0.5,cy-R*0.5,R*1.1);
  rim.addColorStop(0,'rgba(255,255,255,0)');rim.addColorStop(1,'rgba(244,213,141,.18)');
  ctx.fillStyle=rim;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();ctx.restore();
}
const CONTINENTS=[{lat:20,lon:40,r:.5},{lat:-25,lon:130,r:.6},{lat:10,lon:230,r:.45},
  {lat:-10,lon:310,r:.5},{lat:50,lon:180,r:.4}];

function drawItems(){
  // รวมของบนผิว (ดาวที่ปลูก + จุดเรืองแสง) แล้วเรียงตาม z
  const items=[];
  planted.forEach(s=>{const p=project(s.lat,s.lon);if(p.z>0.02)items.push({type:'star',p});});
  PLANET.landmarks.forEach((l,i)=>{const p=project(l.lat,l.lon);if(p.z>0.05)items.push({type:'mark',p,l,i});});
  items.sort((a,b)=>a.p.z-b.p.z);
  items.forEach(it=>{
    if(it.type==='star'){
      const rr=(1.6+1.6*it.p.z)*DPR;
      const gg=ctx.createRadialGradient(it.p.sx,it.p.sy,0,it.p.sx,it.p.sy,rr*2.4);
      gg.addColorStop(0,'rgba(255,250,230,'+(.9*it.p.z)+')');gg.addColorStop(.5,'rgba(244,213,141,'+(.6*it.p.z)+')');
      gg.addColorStop(1,'rgba(244,213,141,0)');
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(it.p.sx,it.p.sy,rr*2.4,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,'+it.p.z+')';ctx.beginPath();ctx.arc(it.p.sx,it.p.sy,rr*0.6,0,7);ctx.fill();
    }else{
      // แหวนกระพริบบอกว่าแตะได้
      const pulse=(Math.sin(t*0.08+it.i)*0.5+0.5);
      ctx.strokeStyle='rgba(240,166,192,'+(.35*it.p.z*(0.4+0.6*pulse))+')';ctx.lineWidth=1.4*DPR;
      ctx.beginPath();ctx.arc(it.p.sx,it.p.sy,(13+4*pulse)*DPR*(0.6+0.4*it.p.z),0,7);ctx.stroke();
      const fs=(17+7*it.p.z)*DPR;
      ctx.font=fs+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.globalAlpha=Math.min(1,0.4+it.p.z);
      ctx.fillText(it.l.icon,it.p.sx,it.p.sy);ctx.globalAlpha=1;
    }
  });
}

function moonPos(){
  const mx=cx+1.72*R*Math.sin(moonA);
  const my=cy-0.5*R + 0.34*R*Math.cos(moonA);
  const mz=Math.cos(moonA); // >0 หน้า
  return {mx,my,mz};
}
function drawMoon(front){
  const {mx,my,mz}=moonPos();
  if((mz>0)!==front)return;
  const mr=R*0.16;
  const gl=ctx.createRadialGradient(mx,my,0,mx,my,mr*2.4);
  gl.addColorStop(0,'rgba(246,230,176,.5)');gl.addColorStop(1,'rgba(246,230,176,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(mx,my,mr*2.4,0,7);ctx.fill();
  const gm=ctx.createRadialGradient(mx-mr*0.35,my-mr*0.35,mr*0.1,mx,my,mr);
  gm.addColorStop(0,'#fff');gm.addColorStop(.55,'#f6e6b0');gm.addColorStop(1,'#d9b45f');
  ctx.fillStyle=gm;ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();
}

function loop(){
  t+=reduce?0:1;
  if(!dragging){rot+=(autoSpin+vel);vel*=0.94;}
  moonA+=reduce?0:0.006;
  ctx.clearRect(0,0,W,H);
  for(const s of bg){const tw=reduce?.7:(Math.sin(t*s.sp+s.tw)*.4+.6);
    ctx.fillStyle="rgba(230,235,255,"+(tw*s.d)+")";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  drawMoon(false);      // พระจันทร์ที่อยู่หลังดาวเคราะห์
  drawPlanet();
  drawItems();
  drawMoon(true);       // พระจันทร์ด้านหน้า
  requestAnimationFrame(loop);
}
loop();

/* ---------------- interaction ---------------- */
function evXY(e){const x=(e.clientX)*DPR,y=(e.clientY)*DPR;return {x,y};}
cv.addEventListener('pointerdown',e=>{dragging=true;moved=0;const p=evXY(e);lastX=p.x;lastY=p.y;
  cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!dragging)return;const p=evXY(e);
  const dx=p.x-lastX;lastX=p.x;lastY=p.y;moved+=Math.abs(dx);
  rot+=dx*0.25;vel=dx*0.02;});
cv.addEventListener('pointerup',e=>{dragging=false;
  if(moved<6*DPR){handleTap(evXY(e));}});
cv.addEventListener('pointercancel',()=>{dragging=false;});

function handleTap(pt){
  // ตรวจพระจันทร์
  const {mx,my}=moonPos();
  if(Math.hypot(pt.x-mx,pt.y-my)<R*0.22){openCard('🌙',PLANET.moon.title,PLANET.moon.msg);return;}
  // ตรวจจุดเรืองแสง (เฉพาะด้านหน้า) เลือกที่ใกล้สุด
  let best=null,bd=28*DPR;
  PLANET.landmarks.forEach(l=>{const p=project(l.lat,l.lon);if(p.z<=0.05)return;
    const d=Math.hypot(pt.x-p.sx,pt.y-p.sy);if(d<bd){bd=d;best=l;}});
  if(best)openCard(best.icon,best.title,best.msg);
}

/* ---------------- การ์ดข้อความ ---------------- */
const card=document.getElementById('card');
function openCard(ico,title,msg){document.getElementById('cardIco').textContent=ico;
  document.getElementById('cardTitle').textContent=title;document.getElementById('cardMsg').textContent=msg;
  card.classList.add('show');}
function closeCard(){card.classList.remove('show');}
document.getElementById('cardClose').onclick=closeCard;
document.getElementById('cardBg').onclick=closeCard;

/* ---------------- ปลูกดาว ---------------- */
const toast=document.getElementById('toast');let toastT=null;
function showToast(txt){toast.textContent=txt;toast.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),2600);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
document.getElementById('plantBtn').onclick=function(){
  let last='';try{last=localStorage.getItem('planet_lastPlant')||'';}catch(e){last=window._lp||'';}
  if(last===todayStr()){showToast(PLANET.plantedTodayMsg);return;}
  const lat=Math.random()*150-75, lon=Math.random()*360;
  planted.push({lat,lon});save();
  try{localStorage.setItem('planet_lastPlant',todayStr());}catch(e){window._lp=todayStr();}
  document.getElementById('starCount').textContent=planted.length;
  // หมุนไปโชว์ดาวใหม่นิดนึง
  rot = -lon; vel=0;
  showToast(PLANET.plantMessages[Math.floor(Math.random()*PLANET.plantMessages.length)]);
  ensureAudio();
};

/* ---------------- เสียงบรรเลงนุ่ม ๆ (ตัวเลือก) ---------------- */
let audioCtx,master,padOn=false,padTimer;
function ensureAudio(){if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
function initAudio(){try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  master=audioCtx.createGain();master.gain.value=0;
  const soft=audioCtx.createBiquadFilter();soft.type='lowpass';soft.frequency.value=2400;
  soft.connect(audioCtx.destination);master.connect(soft);
  const delay=audioCtx.createDelay();delay.delayTime.value=.3;const fb=audioCtx.createGain();fb.gain.value=.3;
  const dlp=audioCtx.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=1800;
  const wet=audioCtx.createGain();wet.gain.value=.28;
  delay.connect(dlp);dlp.connect(fb);fb.connect(delay);delay.connect(wet);wet.connect(master);window._d=delay;
  const CH=[[261.63,329.63,392,493.88],[220,261.63,329.63,392],[174.61,220,261.63,329.63],[196,246.94,293.66,349.23]];
  const ROOT=[130.81,110,87.31,98];let ci=0,ni=0;
  padTimer=setInterval(()=>{if(!padOn||audioCtx.state!=='running')return;
    if(ni===0){const nT=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=ROOT[ci];o.connect(g);g.connect(master);
      g.gain.setValueAtTime(0,nT);g.gain.linearRampToValueAtTime(.05,nT+.5);
      g.gain.linearRampToValueAtTime(.0001,nT+2.7);o.start(nT);o.stop(nT+2.8);}
    const f=CH[ci][ni],nT=audioCtx.currentTime;
    [[1,.085],[2,.03],[3,.01]].forEach(([m,v])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=f*m;o.connect(g);g.connect(master);if(window._d)g.connect(window._d);
      g.gain.setValueAtTime(0,nT);g.gain.linearRampToValueAtTime(v,nT+.012);
      g.gain.exponentialRampToValueAtTime(.0001,nT+1.7);o.start(nT);o.stop(nT+1.8);});
    ni++;if(ni>=4){ni=0;ci=(ci+1)%4;}},600);
}catch(e){}}
document.getElementById('soundBtn').onclick=function(){
  if(!audioCtx)initAudio();ensureAudio();padOn=!padOn;
  if(master)master.gain.linearRampToValueAtTime(padOn?.5:0,audioCtx.currentTime+.5);
  this.textContent=padOn?'🔊':'🔇';
};
</script>
